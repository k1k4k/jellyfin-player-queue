name: Release

# Pousser un tag vX.Y.Z (la version doit correspondre à <AssemblyVersion> du csproj) :
#   git tag v0.3.0 && git push origin v0.3.0
# -> build jf12 + jf10, zips attachés à la release GitHub, manifest.json / manifest-10.11.json
#    mis à jour et committés sur main.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Check tag matches AssemblyVersion
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -oP '<AssemblyVersion>\K[\d.]+(?=</AssemblyVersion>)' Jellyfin.Plugin.QueueOsd/Jellyfin.Plugin.QueueOsd.csproj)
          echo "tag=$TAG csproj=$VER"
          [ "$VER" = "$TAG.0" ] || [ "$VER" = "$TAG" ] || { echo "Le tag ($TAG) ne correspond pas à AssemblyVersion ($VER)"; exit 1; }

      - name: Build jf12 (.NET 10)
        run: dotnet build Jellyfin.Plugin.QueueOsd/Jellyfin.Plugin.QueueOsd.csproj -c Release -p:JellyfinTarget=jf12 -o out/jf12

      - name: Build jf10 (.NET 9)
        run: dotnet build Jellyfin.Plugin.QueueOsd/Jellyfin.Plugin.QueueOsd.csproj -c Release -p:JellyfinTarget=jf10 -o out/jf10

      - name: Package + update manifests
        run: |
          python3 scripts/package.py --target jf12 --dll out/jf12/Jellyfin.Plugin.QueueOsd.dll --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          python3 scripts/package.py --target jf10 --dll out/jf10/Jellyfin.Plugin.QueueOsd.dll --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-10.11.json
          git commit -m "manifests: $GITHUB_REF_NAME" || echo "nothing to commit"
          git push origin HEAD:main
