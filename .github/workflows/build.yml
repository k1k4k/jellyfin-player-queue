name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "manifest*.json"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: jf12
            dotnet: 10.0.x
          - target: jf10
            dotnet: 9.0.x
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Build (${{ matrix.target }})
        run: dotnet build Jellyfin.Plugin.QueueOsd/Jellyfin.Plugin.QueueOsd.csproj -c Release -p:JellyfinTarget=${{ matrix.target }}
      - name: Syntax check client script
        run: node --check jellyfin-queue-osd.js
